<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Majestic World</title>

<style>
body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

/* UI */
#ui{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#0f172a;
    padding:10px;
    box-shadow:0 0 20px #6366f1;
}

button{
    margin:5px;
    padding:8px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#6366f1,#8b5cf6);
    color:white;
    cursor:pointer;
}

/* GAME */
canvas{
    display:block;
}

/* Баннер */
#banner{
    position:fixed;
    right:10px;
    top:70px;
    background:#111827;
    padding:10px;
    border-radius:10px;
    box-shadow:0 0 15px #8b5cf6;
}
</style>
</head>

<body>

<div id="ui">
💰 <span id="gold">1000</span>  
🌙 <span id="orbs">0</span>

<button onclick="roll()">🎰 Баннер (1 orb)</button>
<button onclick="convert()">🔁 100 gold → orb</button>
<button onclick="spawnBoss()">👹 Босс</button>
</div>

<div id="banner">
<b>🌙 Лунный баннер</b><br>
⭐ Astra (5%)<br>
⭐ Luna (25%)<br>
⭐ Noctis (70%)
</div>

<canvas id="game"></canvas>

<script>

// ===== РЕСУРСЫ =====
let gold = 1000
let orbs = 0

let heroes = []

// ===== ГАЧА =====
function roll(){
    if(orbs < 1){
        alert("Нет шаров")
        return
    }

    orbs--

    let r = Math.random()
    let hero

    if(r < 0.05) hero = {name:"Astra", atk:40}
    else if(r < 0.30) hero = {name:"Luna", atk:25}
    else hero = {name:"Noctis", atk:15}

    hero.lvl = 1
    heroes.push(hero)

    alert("Выпал: " + hero.name)
    updateUI()
}

function convert(){
    if(gold < 100) return
    gold -= 100
    orbs++
    updateUI()
}

// ===== UI =====
function updateUI(){
    goldEl.innerText = gold
    orbEl.innerText = orbs
}

let goldEl = document.getElementById("gold")
let orbEl = document.getElementById("orbs")

// ===== КАНВАС =====
let canvas = document.getElementById("game")
let ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

// ===== ИГРОК =====
let player = {
    x:200,
    y:200,
    size:40,
    speed:4,
    frame:0
}

// ===== ВРАГ =====
let boss = null

function spawnBoss(){
    boss = {
        x:500,
        y:300,
        hp:200
    }
}

// ===== УПРАВЛЕНИЕ =====
let keys = {}

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true
})

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false
})

// ===== ИГРА =====
function gameLoop(){

    ctx.fillStyle = "#020617"
    ctx.fillRect(0,0,canvas.width,canvas.height)

    // движение
    let moving = false

    if(keys["w"]){ player.y -= player.speed; moving=true }
    if(keys["s"]){ player.y += player.speed; moving=true }
    if(keys["a"]){ player.x -= player.speed; moving=true }
    if(keys["d"]){ player.x += player.speed; moving=true }

    // анимация (мигание)
    if(moving){
        player.frame++
    }

    ctx.fillStyle = player.frame % 20 < 10 ? "#8b5cf6" : "#6366f1"
    ctx.fillRect(player.x, player.y, player.size, player.size)

    // БОСС
    if(boss){
        ctx.fillStyle = "red"
        ctx.fillRect(boss.x, boss.y, 60, 60)

        ctx.fillStyle = "white"
        ctx.fillText("HP: " + boss.hp, boss.x, boss.y - 10)

        // бой
        if(
            player.x < boss.x + 60 &&
            player.x + player.size > boss.x &&
            player.y < boss.y + 60 &&
            player.y + player.size > boss.y
        ){
            let atk = heroes.reduce((s,h)=>s+h.atk,0) || 5
            boss.hp -= atk * 0.1

            if(boss.hp <= 0){
                alert("Босс убит!")
                gold += 500
                boss = null
                updateUI()
            }
        }
    }

    requestAnimationFrame(gameLoop)
}

gameLoop()

updateUI()

</script>

</body>
</html>
