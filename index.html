<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Pixel Anime RPG</title>

<style>
body{margin:0;overflow:hidden;background:#020617;color:white;font-family:sans-serif}
canvas{display:block}

/* UI */
#top{
position:fixed;top:0;width:100%;
background:#0f172a;padding:10px;
z-index:10;
}

#menu{
position:fixed;
top:60px;
left:10px;
background:#0f172a;
padding:10px;
display:none;
}

#banner{
position:fixed;
top:60px;
right:10px;
background:#1e293b;
padding:10px;
display:none;
}

img{width:100px}

/* кнопки */
#right{
position:fixed;
bottom:30px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.btn{
width:70px;height:70px;
border-radius:50%;
border:none;
background:#6366f1;
color:white;
font-size:20px;
}

/* джойстик */
#joy{
position:fixed;
bottom:30px;
left:30px;
width:120px;height:120px;
background:rgba(255,255,255,0.1);
border-radius:50%;
}

#stick{
position:absolute;
left:40px;top:40px;
width:40px;height:40px;
background:#818cf8;
border-radius:50%;
}
</style>
</head>

<body>

<div id="top">
💎 <span id="gems">100</span>
<button onclick="openInv()">🎒</button>
<button onclick="openBanner()">🎰</button>
</div>

<!-- ИНВЕНТАРЬ -->
<div id="menu">
<h3>Инвентарь</h3>
<div id="inv"></div>
</div>

<!-- БАННЕР -->
<div id="banner">
<h3>Баннер</h3>
<img src="https://i.imgur.com/3W3ZQZQ.png">
<br>
<button onclick="wish()">Крутить (10💎)</button>
</div>

<canvas id="game"></canvas>

<div id="joy"><div id="stick"></div></div>

<div id="right">
<button class="btn" onclick="atk()">⚔️</button>
<button class="btn" onclick="skill()">E</button>
<button class="btn" onclick="ult()">Q</button>
</div>

<script>

// canvas
const c = document.getElementById("game")
const ctx = c.getContext("2d")
c.width = innerWidth
c.height = innerHeight

// ===== ДАННЫЕ =====
let gems = 100
let level = 1

const weapons = ["Меч","Лук","Копьё"]
const artifacts = ["Кольцо","Амулет","Корона"]

let inventory = []

// ===== СПРАЙТЫ =====
const playerImg = new Image()
playerImg.src = "https://i.imgur.com/Z6X6X9b.png"

const bossImg = new Image()
bossImg.src = "https://i.imgur.com/7QZ6G7K.png"

// ===== ИГРОК =====
let p = {x:200,y:200,s:64}

// ===== БОСС =====
let boss = {x:600,y:300,hp:200}

// ===== ЭФФЕКТЫ =====
let fx = []
function effect(x,y,c){
fx.push({x,y,s:10,life:20,color:c})
}

// ===== БОЕВКА =====
function atk(){
boss.hp -= 5*level
effect(boss.x,boss.y,"yellow")
}

function skill(){
boss.hp -= 10*level
effect(boss.x,boss.y,"blue")
}

function ult(){
boss.hp -= 20*level
effect(boss.x,boss.y,"purple")
}

// ===== ГАЧА =====
function wish(){
if(gems<10)return
gems-=10

let drop=Math.random()

if(drop<0.5){
let w=weapons[Math.floor(Math.random()*weapons.length)]
inventory.push(w)
alert("Оружие: "+w)
}else{
let a=artifacts[Math.floor(Math.random()*artifacts.length)]
inventory.push(a)
alert("Артефакт: "+a)
}
updateInv()
}

// ===== ИНВЕНТАРЬ =====
function openInv(){
let m=document.getElementById("menu")
m.style.display = m.style.display=="none"?"block":"none"
}

function updateInv(){
let div=document.getElementById("inv")
div.innerHTML=""
inventory.forEach(i=>{
div.innerHTML+= "<div>"+i+"</div>"
})
}

// ===== БАННЕР =====
function openBanner(){
let b=document.getElementById("banner")
b.style.display = b.style.display=="none"?"block":"none"
}

// ===== ДЖОЙСТИК =====
let joyX=0, joyY=0, drag=false

const joy=document.getElementById("joy")
const stick=document.getElementById("stick")

joy.addEventListener("touchstart",()=>drag=true)

document.addEventListener("touchmove",e=>{
if(!drag)return

let r=joy.getBoundingClientRect()
let x=e.touches[0].clientX-r.left-60
let y=e.touches[0].clientY-r.top-60

let d=Math.sqrt(x*x+y*y)
if(d>40){x=x/d*40;y=y/d*40}

stick.style.left=(x+60-20)+"px"
stick.style.top=(y+60-20)+"px"

joyX=x/40
joyY=y/40
})

document.addEventListener("touchend",()=>{
drag=false
joyX=joyY=0
stick.style.left="40px"
stick.style.top="40px"
})

// ===== LOOP =====
function loop(){

// движение
p.x += joyX*5
p.y += joyY*5

ctx.fillStyle="#020617"
ctx.fillRect(0,0,c.width,c.height)

// игрок
ctx.drawImage(playerImg,p.x,p.y,64,64)

// босс
ctx.drawImage(bossImg,boss.x,boss.y,96,96)

// эффекты
fx.forEach((e,i)=>{
ctx.fillStyle=e.color
ctx.beginPath()
ctx.arc(e.x,e.y,e.s,0,Math.PI*2)
ctx.fill()
e.s+=1
e.life--
if(e.life<=0)fx.splice(i,1)
})

// UI
document.getElementById("gems").innerText=gems

ctx.fillStyle="white"
ctx.fillText("HP босса: "+boss.hp,20,50)
ctx.fillText("LVL: "+level,20,70)

requestAnimationFrame(loop)
}

loop()

</script>
</body>
</html>
