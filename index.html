<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Majestic World</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(#0b0f2a,#020617);
    color:white;
    text-align:center;
}

#top{
    background:#111827;
    padding:10px;
    box-shadow:0 0 20px #6366f1;
}

button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#6366f1,#8b5cf6);
    color:white;
    cursor:pointer;
}

.card{
    display:inline-block;
    width:130px;
    background:#111827;
    margin:5px;
    padding:5px;
    border-radius:10px;
    box-shadow:0 0 10px #6366f1;
}

.enemy{
    margin-top:20px;
}
</style>
</head>

<body>

<div id="top">
💰 Gold: <span id="gold">1000</span> |
🌙 Orbs: <span id="orbs">0</span>

<br>

<button onclick="roll()">🎰 Roll (100 gold)</button>
<button onclick="convert()">🌙 Convert 100 gold → orb</button>
<button onclick="spawnBoss()">👹 Boss</button>
</div>

<h2>🌙 Moon World</h2>

<div id="heroes"></div>

<div class="enemy" id="enemy"></div>

<script>

// ===== ДАННЫЕ =====
let gold = 1000
let orbs = 0

let heroes = []
let inventory = []

const banner = [
    {name:"Luna", atk:20},
    {name:"Noctis", atk:25},
    {name:"Astra", atk:30}
]

// ===== ОБНОВЛЕНИЕ =====
function update(){
    document.getElementById("gold").innerText = gold
    document.getElementById("orbs").innerText = orbs

    let h = ""
    heroes.forEach((x,i)=>{
        h += `
        <div class="card">
            <b>${x.name}</b><br>
            ATK: ${x.atk}<br>
            LVL: ${x.lvl}<br>
            <button onclick="levelUp(${i})">⬆️</button>
            <button onclick="equip(${i})">⚔️ Equip</button>
        </div>`
    })

    document.getElementById("heroes").innerHTML = h
}

// ===== ГАЧА =====
function roll(){
    if(gold < 100){
        alert("Нет золота")
        return
    }

    gold -= 100

    let hero = banner[Math.floor(Math.random()*banner.length)]

    heroes.push({
        ...hero,
        lvl:1
    })

    alert("Ты выбил: " + hero.name)
    update()
}

// ===== КОНВЕРТАЦИЯ =====
function convert(){
    if(gold < 100){
        alert("Мало золота")
        return
    }

    gold -= 100
    orbs += 1
    update()
}

// ===== ПРОКАЧКА =====
function levelUp(i){
    if(gold < 50){
        alert("Нужно 50 золота")
        return
    }

    gold -= 50
    heroes[i].lvl++
    heroes[i].atk += 5

    update()
}

// ===== ИНВЕНТАРЬ =====
function equip(i){
    let item = {
        atk: Math.floor(Math.random()*10)+5
    }

    heroes[i].atk += item.atk
    alert("Оружие +" + item.atk)
    update()
}

// ===== БОСС =====
function spawnBoss(){

    let boss = {
        hp:100,
        atk:10
    }

    document.getElementById("enemy").innerHTML = `
    👹 Boss HP: <span id="bosshp">${boss.hp}</span><br>
    <button onclick="attackBoss()">⚔️ Attack</button>
    `

    window.currentBoss = boss
}

// ===== БОЙ =====
function attackBoss(){

    if(!window.currentBoss) return

    let totalAtk = heroes.reduce((s,h)=>s+h.atk,0)

    currentBoss.hp -= totalAtk

    if(currentBoss.hp <= 0){
        alert("Босс побежден!")
        gold += 300
        document.getElementById("enemy").innerHTML = ""
        update()
        return
    }

    document.getElementById("bosshp").innerText = currentBoss.hp
}

// ===== СТАРТ =====
update()

</script>

</body>
</html>
